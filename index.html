<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catalogue</title>
  <meta name="description" content="Catalogue en images : parcourez les articles et composez votre sélection.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="lien-evitement" href="#page">Aller au contenu</a>

  <!-- Barre du haut : menu, marque, recherche, sélection -->
  <header class="barre">
    <button class="bouton-rond" id="ouvrir-menu" type="button" aria-label="Ouvrir le menu" aria-controls="menu" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="barre__marque" href="#/" id="barre-marque">
      <img id="logo" alt="" hidden>
      <span id="barre-titre">Catalogue</span>
    </a>
    <div class="barre__actions">
      <a class="bouton-rond" href="#/recherche" aria-label="Rechercher">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
      <a class="bouton-rond bouton-selection" href="#/selection" id="lien-selection" aria-label="Ma sélection, 0 article">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span class="pastille" id="compteur-selection" hidden>0</span>
      </a>
    </div>
  </header>

  <!-- Menu latéral -->
  <nav class="menu" id="menu" aria-label="Navigation" hidden>
    <div class="menu__entete">
      <p class="menu__titre">Menu</p>
      <button class="bouton-rond" id="fermer-menu" type="button" aria-label="Fermer le menu">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="menu__liens">
      <li><a href="#/">Accueil</a></li>
      <li><a href="#/selection">Ma sélection</a></li>
      <li><a href="#/tout">Tout le catalogue</a></li>
    </ul>
    <p class="menu__groupe">Catégories</p>
    <ul class="menu__liste" id="menu-categories"></ul>
    <p class="menu__groupe">Marques</p>
    <ul class="menu__liste" id="menu-marques"></ul>
  </nav>
  <div class="voile" id="voile" hidden></div>

  <!-- Contenu de la page courante (accueil, liste, sélection) -->
  <main id="page" class="page" tabindex="-1">
    <div class="chargement" role="status"><span class="chargement__barre"></span>Chargement du catalogue…</div>
  </main>

  <footer class="pied">
    <p id="pied-texte"></p>
  </footer>

  <!-- Fiche article en plein écran -->
  <dialog class="fiche" id="fiche" aria-labelledby="fiche-titre">
    <div class="fiche__haut">
      <button class="bouton-rond" type="button" id="fiche-fermer" aria-label="Fermer">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <p class="fiche__position" id="fiche-position" aria-live="polite"></p>
    </div>
    <div class="fiche__scene">
      <button class="fiche__nav fiche__nav--prec" type="button" id="fiche-prec" aria-label="Article précédent">&#8249;</button>
      <figure class="fiche__cadre" id="fiche-cadre"></figure>
      <button class="fiche__nav fiche__nav--suiv" type="button" id="fiche-suiv" aria-label="Article suivant">&#8250;</button>
    </div>
    <div class="fiche__infos" id="fiche-infos"></div>
  </dialog>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <script src="config.js"></script>
  <script src="donnees.js"></script>
  <script src="app.js"></script>
</body>
</html>
